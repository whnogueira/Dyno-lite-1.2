name: Build do Dyno Lite

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Testar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar build
        run: |
          chmod +x ./gradlew
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Executar testes
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Gerar APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dyno-Lite-v1.2-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dyno-Lite-v1.2-${{ github.run_number }}
          path: Dyno-Lite-v1.2-debug.apk
          retention-days: 30
