name: Build do Dyno Lite

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Testar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Extrair código do Dyno Lite
        shell: bash
        run: |
          test -f Dyno-lite-v1.2.zip
          mkdir -p codigo
          unzip -q Dyno-lite-v1.2.zip -d codigo
          test -d codigo/dyno-lite-beta2/app

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-36.1"

      - name: Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Preparar arquivos
        run: touch codigo/dyno-lite-beta2/.env

      - name: Executar testes
        run: gradle -p codigo/dyno-lite-beta2 testDebugUnitTest --stacktrace --no-daemon

      - name: Gerar APK
        run: gradle -p codigo/dyno-lite-beta2 assembleDebug --stacktrace --no-daemon

      - name: Preparar APK para download
        run: |
          cp codigo/dyno-lite-beta2/app/build/outputs/apk/debug/app-debug.apk \
          Dyno-Lite-v1.2-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dyno-Lite-v1.2-${{ github.run_number }}
          path: Dyno-Lite-v1.2-debug.apk
          if-no-files-found: error
          retention-days: 30
