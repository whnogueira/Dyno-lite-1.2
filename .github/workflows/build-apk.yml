name: Build do Dyno Lite

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Testar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-36.1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar build
        shell: bash
        run: |
          chmod +x ./gradlew
          touch .env

      - name: Executar testes
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Gerar APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dyno-Lite-v1.2-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dyno-Lite-v1.2-${{ github.run_number }}
          path: Dyno-Lite-v1.2-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Salvar relatório se os testes falharem
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-falha-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
